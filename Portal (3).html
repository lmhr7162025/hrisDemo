/* ===== Executive dashboard layout: 12-column grid ===== */
.dsh .dh{align-items:center}.dht{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.dfl{display:flex;gap:8px;align-items:center}.dfl select{max-width:230px;margin:0}.dfl button{margin:0!important}
.stats{grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:10px;margin-bottom:10px}
.stat{padding:12px 14px;border-radius:18px}.stat b{font-size:24px}.stat span{font-size:12px}
.pg{grid-template-columns:repeat(12,minmax(0,1fr))!important;gap:12px;grid-auto-flow:dense;align-items:stretch;margin-top:6px}
.pg>.panel{grid-column:span 4;display:flex;flex-direction:column;min-width:0}
.pg>.panel.s3{grid-column:span 3}.pg>.panel.s6{grid-column:span 6}.pg>.panel.s8{grid-column:span 8}.pg>.panel.s12{grid-column:1/-1}
.pg>.panel>b{font-size:13.5px;margin-bottom:4px}.pg>.panel .dn{flex:1;margin-top:6px}
.brs{max-height:250px;overflow:auto;padding-right:2px}
.mpd{position:absolute;right:16px;top:14px}.pg>.panel.wide{position:relative}
.sh{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:12px 0 0;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.sh:first-child{margin-top:4px}.sh:after{content:"";flex:1;height:1px;background:var(--bd)}
@media(min-width:761px){.shell{max-width:1560px;padding:0 14px}.br{grid-template-columns:130px 1fr 34px}}
@media(max-width:1180px){.pg>.panel,.pg>.panel.s3,.pg>.panel.s4,.pg>.panel.s6{grid-column:span 6}.pg>.panel.s8,.pg>.panel.s12{grid-column:1/-1}
 .stats{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
@media(max-width:760px){.pg>.panel,.pg>.panel.s3,.pg>.panel.s4,.pg>.panel.s6{grid-column:1/-1}.dfl{width:100%}.dfl select{max-width:none;flex:1}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat b{font-size:22px}.mpd{position:static;display:block;float:none;margin:2px 0 4px}}

/* ===== Phase 2: attendance ===== */
.attw{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:16px;align-items:start}
.attc{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 16px;border:1px solid var(--bd);border-radius:24px;background:var(--s2)}
.attclk{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}.attdt{color:var(--mu);font-size:13px;margin-bottom:8px}
.radarw{min-height:200px;display:flex;align-items:center;justify-content:center;width:100%}.rdr{max-width:100%;height:auto}
.rg{fill:#cee9bd22;stroke:var(--lc);stroke-width:2}.rg.out{fill:#ff8a7022;stroke:var(--err);stroke-dasharray:5 4}.rc{fill:var(--mu)}.ra{fill:#4da3ff30;stroke:#4da3ff;stroke-width:1}.ru{fill:#4da3ff;stroke:#fff;stroke-width:2}
.attgps{margin:6px 0 10px;font-size:13.5px;line-height:1.45;min-height:40px}.attgps .good{color:var(--lc);font-weight:700}.attgps .bad{color:var(--err);font-weight:600}
.attbtn{width:100%;max-width:340px;padding:15px 20px!important;border-radius:18px!important;font-size:18px!important;font-weight:800;margin-top:4px!important}
.attbtn.out{background:linear-gradient(135deg,#ffb27a,#e5654b)!important;color:#1b0b05!important}.attbtn:disabled{opacity:.45;filter:grayscale(.4)}
.atts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.atts .stat{margin:0}.atst{grid-column:1/-1}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chip.ok{background:#cee9bd2e;color:var(--lc)}.chip.warn{background:#ffc86b2e;color:#e0a43a}.chip.bad{background:#ff8a7026;color:var(--err)}.chip.info{background:#4da3ff26;color:#4da3ff}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--bd);border-radius:14px;margin:6px 0 10px;flex-wrap:wrap}.seg button{margin:0!important;padding:6px 14px!important;background:transparent!important;color:var(--mu)!important;border:0!important;box-shadow:none!important;border-radius:10px!important}
.seg button.on{background:var(--grad)!important;color:var(--on)!important;font-weight:700}.mlk{text-decoration:none}
@media(max-width:900px){.attw{grid-template-columns:1fr}.attclk{font-size:34px}}

/* ===== Phase 2b: phone lock, requests, schedules ===== */
.dvw{padding:10px 14px;border-radius:14px;margin:0 0 12px;font-size:13.5px;line-height:1.45;border:1px solid var(--bd)}
.dvw.ok{background:#cee9bd1f;color:var(--lc)}.dvw.warn{background:#ffc86b22;border-color:#ffc86b66}.dvw.bad{background:#ff8a7020;border-color:var(--err);color:var(--tx)}
.upc{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}.upd{flex:none;min-width:52px;padding:8px 6px;border-radius:14px;text-align:center;line-height:1.2;border:1px solid var(--bd)}
.upd small{display:block;color:var(--mu);font-size:11px}.upd b{display:block;font-size:18px}.upd span{display:block;font-size:12px;font-weight:700}
.s0{background:#cee9bd33;color:var(--lc)}.s1{background:#ffd27a33;color:#e0a43a}.s2{background:#ff9a7a33;color:#ff8a68}.s3{background:#8b9bff33;color:#8b9bff}.s4{background:#7ad7e533;color:#3fb7c9}.s5{background:#e59aff33;color:#c77ae6}.s6{background:#a3e09033;color:#7fc46b}.so{background:#8a8a8a26;color:var(--mu)}.sx{color:var(--mu)}
.chip.s0,.chip.s1,.chip.s2,.chip.s3,.chip.s4,.chip.s5,.chip.s6,.chip.so{font-weight:800}
.brushes{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 4px}.brushes b{margin-right:4px}
.brush{margin:0!important;padding:5px 10px!important;border-radius:12px!important;border:2px solid transparent!important;box-shadow:none!important;font-weight:800;line-height:1.1;text-align:center}
.brush small{display:block;font-size:10px;font-weight:500;opacity:.85}.brush.on{border-color:var(--tx)!important;transform:scale(1.06)}
.schw{overflow:auto;max-height:68vh;border:1px solid var(--bd);border-radius:16px}
.sg{border-collapse:separate;border-spacing:0;font-size:12px;width:max-content;min-width:100%}
.sg th,.sg td{padding:0;text-align:center;border-bottom:1px solid var(--bd);border-right:1px solid #ffffff0d}
.sg thead th{position:sticky;top:0;z-index:3;background:var(--s2);padding:4px 0;min-width:34px;font-size:12px}.sg thead th small{display:block;color:var(--mu);font-size:10px}
.sg thead th.we{color:var(--err)}.sg thead th.tdy{background:var(--grad);color:var(--on)}
.sg th.fx{position:sticky;left:0;z-index:2;background:var(--s2);text-align:left;min-width:190px;max-width:230px;padding:6px 10px;font-weight:600;white-space:nowrap}
.sg thead th.fx{z-index:4}.sg th.fx small{display:block;color:var(--mu);font-size:10.5px;font-weight:400;overflow:hidden;text-overflow:ellipsis;margin-left:22px}
.sg th.fx .nm{display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}.sg th.fx input{width:auto;margin:0 4px 0 0}
.sgc{height:34px;min-width:34px;cursor:pointer;font-weight:800;user-select:none}.sgc:hover{filter:brightness(1.25)}.sgc.ch{outline:2px solid var(--lc);outline-offset:-2px}.sgc.lk{opacity:.4;cursor:not-allowed}
.sg tfoot th,.sg tfoot td{background:var(--s1);color:var(--mu);height:26px;font-size:11.5px}
.sbar{margin:10px 0}.dws{display:flex;flex-wrap:wrap;gap:6px}.dwk{margin:0!important;padding:6px 10px;border:1px solid var(--bd);border-radius:12px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.presets button{margin:0!important;padding:5px 12px!important}
button.arm{background:var(--err)!important;color:#fff!important}
@media(max-width:760px){.sg th.fx{min-width:130px;max-width:150px}.sg th.fx .nm{max-width:100px}}

/* ===== My HRIS dashboard ===== */
.rgs{display:flex;gap:14px;justify-content:space-around;align-items:flex-start;margin:6px 0}.rg2{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}.rg2 small{color:var(--mu);font-size:11.5px;line-height:1.3}
.miss{margin-top:4px}.miss small{color:var(--mu)}
.bar2{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin:8px 0 4px}.bar2 i{display:block;height:100%;border-radius:99px;transition:width .6s}
.mini{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px}.mini li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px dashed var(--bd)}.mini li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.calh b{font-size:15px}.calh button{padding:4px 14px!important}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.calw{text-align:center;font-size:11px;font-weight:700;color:var(--mu);padding:2px 0}
.cal{min-height:70px;padding:5px 6px;border-radius:12px;border:1px solid var(--bd);font-size:11px;line-height:1.25;position:relative;overflow:hidden;cursor:default;background:var(--s1)}
.cal.blank{border:0;background:transparent}.cal b{font-size:13px;display:block}.cal .cs{position:absolute;top:5px;right:6px;font-weight:800;font-size:10.5px;color:var(--mu)}.cal em{display:block;font-style:normal;color:var(--tx);font-size:10.5px;margin-top:2px;white-space:nowrap}.cal small{display:block;font-size:10px;font-weight:700;margin-top:1px}
.cal.today{outline:2px solid var(--lc);outline-offset:-1px}
.c-ok{background:#cee9bd22}.c-ok small{color:var(--lc)}.c-in{background:#4da3ff1f}.c-in small{color:#4da3ff}
.c-late,.c-under{background:#ffc86b22}.c-late small,.c-under small{color:#e0a43a}.c-missing{background:#ff8a7026;border-color:var(--err);cursor:pointer}.c-missing small{color:var(--err)}
.c-noout{background:#4da3ff22;border-color:#4da3ff;cursor:pointer}.c-noout small{color:#4da3ff}.c-invalid{background:#ff8a7026;border:1px dashed var(--err);cursor:pointer}.c-invalid small{color:var(--err)}
.c-leave{background:#c77ae61f}.c-leave small{color:#c77ae6}.c-rest{background:transparent;opacity:.55}.c-future,.c-pre,.c-pending{opacity:.7}.c-late,.c-under,.c-ok{cursor:pointer}

  else body=`<div class="sc"><table class="rt"><thead><tr><th>Emp No</th><th>Name</th><th>Company</th><th>Department</th>${ed?'<th></th>':''}</tr></thead><tbody>${R.missing.map((x,i)=>`<tr><td data-l="Emp No">${esc(x.id)}</td><td data-l="Name">${esc(x.name)}</td><td data-l="Company">${esc(x.company)}</td><td data-l="Department">${esc(x.dept)}</td>${ed?`<td class="act"><button class="sec" style="margin:0;padding:3px 10px" data-mis="${i}">Add record</button></td>`:''}</tr>`).join('')||'<tr><td>Everyone in scope has timed in.</td></tr>'}</tbody></table></div>`;
  $('ro').innerHTML=kpi()+tabs()+body;
  $('ro').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;draw();});
  $('ro').querySelectorAll('[data-adj]').forEach(b=>b.onclick=()=>{const x=R.detail[+b.dataset.adj];adj(x.id,x.name,x.date,x.tin.slice(0,5),x.tout.slice(0,5));});
  $('ro').querySelectorAll('[data-mis]').forEach(b=>b.onclick=()=>{const x=R.missing[+b.dataset.mis];adj(x.id,x.name,R.from,'','');});};
 const adj=(id,name,date,ti,to)=>{$('adj').innerHTML=`<div class="card" style="max-width:none;margin:10px 0;border:1px solid var(--bd)"><b>Correct attendance · ${esc(name)} (${esc(id)}) · ${esc(date)}</b>
   <div class="grid"><div><label>Time in</label><input type="time" id="aj1" value="${esc(ti)}"></div><div><label>Time out (optional)</label><input type="time" id="aj2" value="${esc(to)}"></div><div style="grid-column:1/-1"><label>Reason (required, kept in the record)</label><input id="aj3" placeholder="e.g. Forgot to time out; approved by supervisor"></div></div>
   <button id="aj4">Save correction</button> <button class="sec" id="aj5">Cancel</button> <span class="err" id="e2"></span></div>`;$('adj').scrollIntoView({behavior:'smooth',block:'nearest'});
  $('aj5').onclick=()=>$('adj').innerHTML='';
  $('aj4').onclick=()=>busy($('aj4'),async()=>{await run('api_attAdjust',T,id,date,$('aj1').value,$('aj2').value,'',$('aj3').value);$('adj').innerHTML='';await go();},'e2');};
 const go=async()=>{$('e').textContent='';$('ro').innerHTML='Loading…';R=await run('api_attReport',T,$('rf').value,$('rt').value,all?$('rc').value:'',all?$('rd').value:'');if(view==='mis'&&R.from!==R.to)view='sum';$('rx').disabled=false;draw();};
 $('rr').onclick=()=>busy($('rr'),go,'e');
 $('rx').onclick=()=>{if(!R)return;const nm='attendance_'+(view==='sum'?'summary':view==='day'?'daily':'not_timed_in')+'_'+R.from+'_'+R.to+'.csv';
  if(view==='sum')csvSave(nm,['Emp No','Name','Company','Department','Days present','Late (times)','Late (min)','Undertime (times)','Undertime (min)','Hours worked','No time-out','Outside GPS','Invalid logs'],R.summary.map(x=>[x.id,x.name,x.company,x.dept,x.days,x.lateCount,x.lateMin,x.underCount,x.underMin,x.hours,x.noOut,x.outside,x.invalid]));
  else if(view==='day')csvSave(nm,['Date','Emp No','Name','Company','Department','Branch','Time in','Time out','Late (min)','Undertime (min)','Hours worked','GPS in','GPS out','Distance in (m)','Shift','Valid','Invalid reason','Phone','Note'],R.detail.map(x=>[x.date,x.id,x.name,x.company,x.dept,x.branch,x.tin,x.tout,x.late,x.under,x.work,x.inGps,x.outGps,x.inDist,x.shift,x.valid,x.why,x.device,x.note]));
  else csvSave(nm,['Emp No','Name','Company','Department'],R.missing.map(x=>[x.id,x.name,x.company,x.dept]));};
 $('rr').click();}

 let y=n.getFullYear()-s.getFullYear(),m=n.getMonth()-s.getMonth();if(n.getDate()<s.getDate())m--;if(m<0){y--;m+=12;}
 const t=((y?y+(y>1?' yrs':' yr')+' ':'')+(m?m+(m>1?' mos':' mo'):'')).trim();return t||'Less than a month';}

function countUp(root){
 if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 root.querySelectorAll('.stat b').forEach(el=>{
  const m=/^([0-9]+(?:[.][0-9]+)?)(.*)$/.exec(el.textContent.trim());if(!m)return;
  const end=parseFloat(m[1]),dec=(m[1].split('.')[1]||'').length,suf=m[2],t0=performance.now();
  const step=t=>{const k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);el.textContent=(end*e).toFixed(dec)+suf;if(k<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);});}
function saveFile(r){
 const bin=atob(r.b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type:r.mime}));a.download=r.name;document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},5000);}

 ${sel('f_company','Company',B.lists.Company)}${sel('f_department','Department',B.lists.Department)}${sel('f_workLocation','Work location',B.lists['Work Location'])}${sel('f_employmentStatus','Employment status',B.lists['Employment Status'])}${sel('f_positionLevel','Position level',B.lists['Position Level'])}${sel('f_gender','Gender',B.lists.Gender)}

 <div class="hint">Files contain personal information protected by the Data Privacy Act. Every download is recorded in the login history.</div>
 <button id="dlb">⬇ Download</button> <span class="ok" id="ok"></span><div class="err" id="e"></div>`;
 $('dlb').onclick=()=>busy($('dlb'),async()=>{

  $('ok').textContent='Preparing file…';
  const r=await run('api_export',T,{format:fmt,groups:groups,filters:f});
  saveFile(r);$('ok').textContent='Downloaded '+r.name+' ('+r.count+' employees)';},'e');}
